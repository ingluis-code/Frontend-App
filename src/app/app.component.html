<h2>Mis Libros Favoritos</h2>
<form class="add-book-form" [formGroup]="bookForm" (ngSubmit)="addOrEditBook()">
  <input type="text" placeholder="Agregar nuevo libro" formControlName="title">
  <button type="submit">{{ edit ? 'Guardar cambios' : 'Agregar libro' }}</button>
</form>

<div class="book-list-container">
  <div class="search-book-input">
    <input placeholder="Buscar libro" (input)="onSearch($event)">
</div>

  @for (book of books; track $index){
    <div class="book-item">
        <span class="book-title">{{ book.title }}</span>
        <div class="buttons">
            <button class="edit" (click)="loadBook(book.id)">Editar</button>
            <button class="delete" (click)="deleteBook(book.id)">Eliminar</button>
        </div>
    </div>
  }@empty {
    <div class="no-items" id="no-books-message">No hay libros disponibles.</div>
  }
</div>
